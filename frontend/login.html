<!DOCTYPE html>
<html>
  <head>
    <title>Quotebook</title>
    <link rel="stylesheet" href="static/style.css">
  </head>
  <body>
    <header id="header">
      <h1><a href="index.html">Quotebook</a></h1>
      <nav id="nav-bar">
        <a href="/login" class="nav-link">Log In</a>
        <a href="/signup" class="nav-link">Signup</a>
      </nav>
    </header>
    <!-- Sign Up Form -->
    <div class="main">
      <form id="login" method="POST" action="/login">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input id="login-email" name="email" type="email" placeholder="Enter your email...">
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input id="login-password" name="password" type="password" placeholder="Enter your password...">
        </div>
        <button id="login-btn" type="submit">Log In</button>
      </form>
    </div>
  </body>
</html>
